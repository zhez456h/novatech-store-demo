const products=[{id:1,name:'轻量通勤帆布包',cat:'包袋',price:129,icon:'👜',color:'peach'},{id:2,name:'极简棉质 T 恤',cat:'服饰',price:89,icon:'👕',color:'blue'},{id:3,name:'柔软针织开衫',cat:'服饰',price:239,icon:'🧥',color:'violet'},{id:4,name:'日常陶瓷马克杯',cat:'家居',price:69,icon:'☕',color:'green'},{id:5,name:'城市探索双肩包',cat:'包袋',price:199,icon:'🎒',color:'green'},{id:6,name:'舒适抱枕',cat:'家居',price:99,icon:'🛋️',color:'peach'}];let category='全部',bag={};function draw(){let rows=products.filter(p=>(category==='全部'||p.cat===category)&&p.name.includes($('#search').value.trim()));$('#products').innerHTML=rows.map(p=>`<article class="card"><div class="swatch ${p.color}">${p.icon}</div><p class="tag">${p.cat} / SAMPLE</p><h2>${p.name}</h2><div class="row"><b class="price">¥${p.price}</b><button data-detail="${p.id}">查看商品</button></div></article>`).join('')||'<p class="empty">没有匹配的示例商品</p>'}function bagView(){const rows=products.filter(p=>bag[p.id]);modal('购物袋',rows.length?rows.map(p=>`<div class="row"><p>${p.name}<br><small>¥${p.price} × ${bag[p.id]}</small></p><div><button data-less="${p.id}">−</button><button data-add="${p.id}">＋</button></div></div>`).join('')+`<hr><h3>合计 ¥${rows.reduce((n,p)=>n+p.price*bag[p.id],0)}</h3><p class="muted">演示购物袋，不提交订单或收款。</p>`:'<p>购物袋还是空的，先选一件喜欢的商品。</p>')}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.cat){category=b.dataset.cat;$$('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));draw()}if(b.dataset.detail){const p=products.find(p=>p.id==b.dataset.detail);modal(p.name,`<div class="swatch ${p.color}">${p.icon}</div><p>精简设计与日常用途。此商品、价格和库存均为示例。</p><h3>¥${p.price}</h3><button class="primary" data-add="${p.id}">加入购物袋</button>`)}if(b.dataset.add){const id=b.dataset.add;bag[id]=(bag[id]||0)+1;$('#cart-count').textContent=Object.values(bag).reduce((a,b)=>a+b,0);if($('#modal-title').textContent==='购物袋'){ $('#modal').close();bagView()}else toast('已加入演示购物袋')}if(b.dataset.less){const id=b.dataset.less;bag[id]=Math.max(0,(bag[id]||0)-1);$('#cart-count').textContent=Object.values(bag).reduce((a,b)=>a+b,0);$('#modal').close();bagView()}});$('#search').oninput=draw;$('#cart').onclick=bagView;draw();</script></body></html>
